# Built-in "research" orchestration.
#
# A showcase coordinator flow demonstrating:
#   1. parallel worker exploration,
#   2. fan-out follow-up investigation, and
#   3. coordinator-authored synthesis.
#
# Usage:
#   mycode orchestrate inspect research
#   mycode orchestrate run research --vars q1="..." --vars q2="..."
#
# Agents reference built-in registry agents via "extends:".
name: research
description: Parallel exploration, fan-out follow-up, and coordinator synthesis
mode: coordinator

vars:
  q1: "Describe the codebase structure and major subsystems"
  q2: "Identify the most important maintenance risks or TODO hotspots"

agents:
  - name: coordinator
    extends: build
    role: coordinator
    description: Synthesizes worker findings into an actionable report
    tools: [read, grep]
    prompt: |
      You are the coordinator for a structured research workflow.
      Your job is not to redo the workers' exploration. Instead:
      1. compare the worker outputs,
      2. highlight the strongest signals,
      3. preserve disagreements or uncertainty, and
      4. end with concrete follow-up recommendations.
      Be specific about which worker observation supports each conclusion.

  - name: explorer
    extends: explore
    role: worker

stages:
  - id: research
    description: Parallel first-pass exploration from two complementary angles
    parallel: true
    max_concurrency: 4
    spawn:
      - agent: explorer
        task: "{{ vars.q1 }}"
      - agent: explorer
        task: "{{ vars.q2 }}"

  - id: deep-dive
    description: Turn each first-pass finding into a sharper follow-up question
    fan_out_from: research
    spawn:
      - agent: explorer
        task: |
          Based on the following earlier finding, identify one concrete follow-up
          detail that a maintainer should investigate next. Include why it matters.

          Prior finding:
          {{ $item }}

  - id: synthesize
    description: Coordinator combines initial findings and deep-dive results
    runs_on: coordinator
    depends_on: [deep-dive]
    inputs: [research.*, deep-dive.*]
    prompt: |
      Produce a concise markdown research brief with these sections:
      1. System Snapshot
      2. Key Risks / Hotspots
      3. Important Unknowns
      4. Suggested Next Actions

      Preserve distinct perspectives from the workers. If two findings pull in
      different directions, call that out explicitly instead of averaging them
      away.
