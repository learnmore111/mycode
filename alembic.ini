# Alembic configuration.
#
# mycode uses an opt-in Alembic integration for versioned schema changes.
# By default the project continues to use the legacy `_migrate()` hook in
# `mycode/storage/database.py` which performs idempotent ALTER TABLE /
# CREATE INDEX statements at startup; that path is sufficient for simple
# additive migrations and keeps first-run setup zero-config.
#
# To opt in to Alembic for a deployment:
#   1. Set MYCODE_ALEMBIC=1 in the environment.
#   2. Run `alembic -c alembic.ini upgrade head` on each deploy.
#
# The script directory defaults to ``mycode/storage/alembic`` and the
# sqlalchemy URL is resolved at runtime in ``env.py`` from the same
# ``get_db_path()`` helper used by production code so dev/prod share one
# source of truth.

[alembic]
script_location = mycode/storage/alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Optional; left unset.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
