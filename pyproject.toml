[project]
name = "opencode"
version = "0.1.0"
description = "Open source AI coding agent - Python edition"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    # HTTP framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.0.0",
    # LLM
    "litellm>=1.50.0",
    # Data validation
    "pydantic>=2.9.0",
    # Database
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    # CLI
    "click>=8.1.0",
    # Logging
    "structlog>=24.0.0",
    # Config
    "json5>=0.9.0",
    # Search
    "rapidfuzz>=3.9.0",
    # ID generation
    "python-ulid>=3.0.0",
    # File I/O
    "aiofiles>=24.0.0",
    # HTTP client
    "httpx>=0.27.0",
    # MCP protocol
    "mcp>=1.0.0",
    # Frontmatter parsing
    "python-frontmatter>=1.1.0",
    # Diff
    "unidiff>=0.7.0",
    "prompt-toolkit>=3.0.52",
    "rich>=14.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
opencode = "opencode.cli.main:cli"
opencode-mcp = "opencode.mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["opencode"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
